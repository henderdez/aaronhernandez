<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Portfolio</title>
<meta id="page-description" name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4EF;
    --paper-deep:#EFEDE4;
    --graphite:#1B1E24;
    --graphite-soft:#565A63;
    --blueprint:#24476B;
    --blueprint-light:#4C6C8C;
    --rust:#C1571F;
    --line:#D4D1C6;
    --line-strong:#B3AF9F;
    --max:920px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(27,30,36,0.035) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(27,30,36,0.035) 40px),
      var(--paper);
    color:var(--graphite);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--blueprint);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--rust); outline-offset:3px;}

  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.02em;
  }

  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:0 28px;
  }

  .nav{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:18px;
    padding:8px 0 16px;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-family:'IBM Plex Mono', monospace;
  }
  .nav a{
    text-decoration:none;
    color:var(--graphite-soft);
  }
  .nav a.primary{
    color:var(--paper);
    background:var(--graphite);
    border:1px solid var(--graphite);
    padding:8px 12px;
    border-radius:999px;
  }

  /* ---------- Title block header ---------- */
  .sheet{
    position:relative;
    padding-top:34px;
  }
  .tick{
    position:absolute;
    width:18px; height:18px;
    border-color:var(--graphite);
    border-style:solid;
    opacity:0.55;
  }
  .tick.tl{ top:14px; left:14px; border-width:1.5px 0 0 1.5px; }
  .tick.tr{ top:14px; right:14px; border-width:1.5px 1.5px 0 0; }
  .tick.bl{ bottom:14px; left:14px; border-width:0 0 1.5px 1.5px; }
  .tick.br{ bottom:14px; right:14px; border-width:0 1.5px 1.5px 0; }

  .titleblock{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1.5px solid var(--graphite);
    padding-bottom:18px;
    margin-bottom:10px;
    flex-wrap:wrap;
    gap:12px;
  }
  .titleblock h1{
    font-size:clamp(2rem, 5vw, 2.9rem);
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .titleblock .role{
    font-size:1.05rem;
    color:var(--blueprint);
    font-weight:500;
    margin-top:6px;
  }
  .titleblock .meta{
    text-align:right;
    font-size:0.78rem;
    color:var(--graphite-soft);
    line-height:1.7;
  }
  .titleblock .meta div span{color:var(--graphite); font-weight:500;}

  /* ---------- Hero ---------- */
  .hero{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:40px;
    align-items:center;
    padding:44px 0 56px 0;
  }
  .hero p{
    font-size:1.08rem;
    color:var(--graphite-soft);
    max-width:46ch;
  }
  .hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:22px;
  }
  .button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 18px;
    border-radius:999px;
    text-decoration:none;
    font-size:0.8rem;
    font-weight:600;
    letter-spacing:0.02em;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .button:hover{ transform:translateY(-1px); }
  .button.primary{
    background:var(--blueprint);
    color:#fff;
    box-shadow:0 10px 22px rgba(36,71,107,0.18);
  }
  .button.secondary{
    background:transparent;
    color:var(--graphite);
    border:1px solid var(--graphite);
  }
  .hero-figure{ position:relative; }
  .hero-figure svg{ width:100%; height:auto; overflow:visible; }
  .draw-line{
    stroke-dasharray:900;
    stroke-dashoffset:900;
    animation:draw 2.2s ease-out forwards;
  }
  .draw-line.d2{ animation-delay:0.25s; }
  .draw-line.d3{ animation-delay:0.5s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .draw-line{ animation:none; stroke-dashoffset:0; }
  }

  .stat-row{
    display:flex;
    gap:28px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .stat{
    border-left:2px solid var(--rust);
    padding-left:10px;
  }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:1.3rem; font-weight:500; }
  .stat .label{ font-size:0.75rem; color:var(--graphite-soft); }

  /* ---------- Sections ---------- */
  section{ padding:38px 0; border-top:1px solid var(--line); }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .section-head h2{ font-size:1.5rem; margin:0; font-weight:600; }
  .section-head .tag{ font-size:0.75rem; color:var(--graphite-soft); }

  /* ---------- Project entries ---------- */
  .project{
    display:grid;
    grid-template-columns:1fr 240px;
    gap:24px;
    padding:22px 0;
    border-bottom:1px solid var(--line);
  }
  .project:last-child{ border-bottom:none; }
  .project h3{ font-size:1.12rem; margin:0 0 8px 0; font-weight:600; }
  .project p{ margin:0; color:var(--graphite-soft); font-size:0.96rem; max-width:52ch; }
  .project-main{ display:grid; gap:16px; }
  .project-media{
    width:100%;
    aspect-ratio:16 / 10;
    border:1px solid var(--line-strong);
    background:
      linear-gradient(135deg, rgba(36,71,107,0.06), rgba(193,87,31,0.06)),
      var(--paper-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .project-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .project-media .placeholder{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--graphite-soft);
    padding:10px 14px;
    border:1px solid var(--line-strong);
    background:rgba(255,255,255,0.25);
  }
  .project .link{
    display:inline-block;
    margin-top:10px;
    font-size:0.85rem;
    text-decoration:none;
    border-bottom:1px solid var(--blueprint-light);
  }
  .project .spec{ font-size:0.76rem; color:var(--blueprint); line-height:1.8; }
  .project .spec .k{ color:var(--graphite-soft); }

  @media (max-width:640px){
    .project{ grid-template-columns:1fr; }
  }

  /* ---------- Skills / spec table ---------- */
  .spectable{ display:grid; grid-template-columns:1fr 1fr; gap:0 48px; }
  .spectable h4{ font-size:0.78rem; color:var(--graphite-soft); margin:0 0 12px 0; font-weight:500; }
  .spectable ul{ list-style:none; margin:0 0 28px 0; padding:0; }
  .spectable li{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .spectable li span.v{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--graphite-soft); }
  @media (max-width:640px){ .spectable{ grid-template-columns:1fr; } }

  /* ---------- Experience ---------- */
  .exp-block{ margin-bottom:26px; }
  .exp-block:last-child{ margin-bottom:0; }
  .exp-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
  }
  .exp-head h3{ margin:0; font-size:1.12rem; font-weight:600; }
  .exp-head .dates{ font-size:0.78rem; color:var(--graphite-soft); }
  .exp-block ul{ margin:0; padding-left:20px; color:var(--graphite-soft); font-size:0.94rem; }
  .exp-block li{ margin-bottom:8px; }

  /* ---------- Footer / contact ---------- */
  footer{
    border-top:1.5px solid var(--graphite);
    padding:30px 0 50px 0;
    margin-top:10px;
    position:relative;
  }
  .contact-grid{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px; }
  .contact-grid a{ display:block; text-decoration:none; font-size:0.95rem; margin-bottom:6px; }
  .contact-grid .label{ font-size:0.72rem; color:var(--graphite-soft); margin-bottom:8px; }
  .footnote{ margin-top:26px; font-size:0.72rem; color:var(--graphite-soft); }
</style>
</head>
<body>

<div class="sheet wrap">
  <span class="tick tl" aria-hidden="true"></span>
  <span class="tick tr" aria-hidden="true"></span>

  <nav class="nav" aria-label="Main navigation">
    <a href="#projects">Projects</a>
    <a href="#skills">Coursework</a>
    <a href="#experience">Experience</a>
    <a class="primary" href="#contact">Contact</a>
  </nav>

  <div class="titleblock">
    <div>
      <h1 id="person-name">&nbsp;</h1>
      <div class="role" id="person-role"></div>
    </div>
    <div class="meta mono">
      <div>SHEET <span id="person-sheet"></span></div>
      <div>REV <span id="person-rev"></span></div>
      <div>LOCATION <span id="person-location"></span></div>
    </div>
  </div>

  <!-- ---------- HERO ---------- -->
  <div class="hero">
    <div>
      <p id="hero-intro"></p>
      <div class="hero-actions">
        <a class="button primary" href="#projects">View Projects</a>
        <a class="button secondary" href="#contact">Get In Touch</a>
      </div>
      <div class="stat-row" id="hero-stats"></div>
    </div>

    <div class="hero-figure" aria-hidden="true">
      <svg viewBox="0 0 320 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="draw-line" cx="160" cy="120" r="70" stroke="#24476B" stroke-width="1.6"/>
        <circle class="draw-line d2" cx="160" cy="120" r="38" stroke="#1B1E24" stroke-width="1.6"/>
        <circle cx="160" cy="120" r="6" fill="#C1571F"/>
        <line class="draw-line d2" x1="160" y1="50" x2="160" y2="18" stroke="#565A63" stroke-width="1"/>
        <line class="draw-line d2" x1="160" y1="190" x2="160" y2="222" stroke="#565A63" stroke-width="1"/>
        <line class="draw-line d3" x1="90" y1="120" x2="18" y2="120" stroke="#565A63" stroke-width="1"/>
        <line class="draw-line d3" x1="230" y1="120" x2="302" y2="120" stroke="#565A63" stroke-width="1"/>
        <text x="8" y="112" class="mono" font-size="9" fill="#565A63">Ø140</text>
        <text x="264" y="112" class="mono" font-size="9" fill="#565A63">Ø76</text>
        <path class="draw-line d3" d="M60 210 Q160 250 260 210" stroke="#B3AF9F" stroke-width="1" stroke-dasharray="4 4"/>
      </svg>
    </div>
  </div>

  <!-- ---------- PROJECTS ---------- -->
  <section id="projects">
    <div class="section-head">
      <h2>Projects</h2>
      <span class="tag mono">SELECTED WORK</span>
    </div>
    <div id="projects-list"></div>
  </section>

  <!-- ---------- SKILLS ---------- -->
  <section id="skills">
    <div class="section-head">
      <h2>Coursework &amp; Tools</h2>
      <span class="tag mono">SPEC SHEET</span>
    </div>
    <div class="spectable">
      <div>
        <h4>ENGINEERING</h4>
        <ul id="skills-engineering"></ul>
      </div>
      <div>
        <h4>TOOLS &amp; AUTOMATION</h4>
        <ul id="skills-tools"></ul>
      </div>
    </div>
  </section>

  <!-- ---------- EXPERIENCE ---------- -->
  <section id="experience">
    <div class="section-head">
      <h2>Professional Experience</h2>
      <span class="tag mono">FIELD WORK</span>
    </div>
    <div id="experience-list"></div>
  </section>

  <!-- ---------- CONTACT / FOOTER ---------- -->
  <footer id="contact">
    <span class="tick bl" aria-hidden="true"></span>
    <span class="tick br" aria-hidden="true"></span>
    <div class="contact-grid">
      <div>
        <div class="label mono">EMAIL</div>
        <a id="contact-email" href="#"></a>
      </div>
      <div>
        <div class="label mono">LINKEDIN</div>
        <a id="contact-linkedin" href="#" target="_blank" rel="noreferrer"></a>
      </div>
      <div>
        <div class="label mono">PHONE</div>
        <a id="contact-phone" href="#"></a>
      </div>
      <div>
        <div class="label mono">RESUME</div>
        <a id="contact-resume" href="#"></a>
      </div>
    </div>
    <div class="footnote mono" id="footnote"></div>
  </footer>
</div>

<!-- Content data (edit this file, not this one) -->
<script src="content.js"></script>

<!-- Render script — reads content.js and fills in the page. No need to edit this. -->
<script>
(function () {
  const data = window.PORTFOLIO_DATA;
  if (!data) {
    document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;'>content.js failed to load. Make sure it's in the same folder as index.html.</p>";
    return;
  }

  document.title = data.pageTitle || "Portfolio";
  document.getElementById('page-title').textContent = data.pageTitle || "Portfolio";
  document.getElementById('page-description').setAttribute('content', data.pageDescription || "");

  const p = data.person || {};
  document.getElementById('person-name').textContent = (p.firstName || "") + " " + (p.lastName || "");
  document.getElementById('person-role').textContent = p.role || "";
  document.getElementById('person-sheet').textContent = p.sheet || "";
  document.getElementById('person-rev').textContent = p.rev || "";
  document.getElementById('person-location').textContent = p.location || "";

  const hero = data.hero || {};
  document.getElementById('hero-intro').textContent = hero.intro || "";
  const statRow = document.getElementById('hero-stats');
  (hero.stats || []).forEach(function (s) {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = '<div class="num mono">' + s.num + '</div><div class="label">' + s.label + '</div>';
    statRow.appendChild(div);
  });

  const projectsList = document.getElementById('projects-list');
  (data.projects || []).forEach(function (proj) {
    const div = document.createElement('div');
    div.className = 'project';
    const mediaHtml = proj.imageSrc
      ? '<img src="' + proj.imageSrc + '" alt="' + (proj.imageAlt || proj.title) + '">'
      : '<div class="placeholder">Project image</div>';
    const specHtml = (proj.spec || []).map(function (s) {
      return '<div><span class="k">' + s.k + ':</span> ' + s.v + '</div>';
    }).join('');
    div.innerHTML =
      '<div class="project-main">' +
        '<div class="project-media">' + mediaHtml + '</div>' +
        '<div>' +
          '<h3>' + proj.title + '</h3>' +
          '<p>' + proj.description + '</p>' +
          '<a class="link" href="' + (proj.linkHref || '#') + '">' + (proj.linkText || 'View →') + '</a>' +
        '</div>' +
      '</div>' +
      '<div class="spec">' + specHtml + '</div>';
    projectsList.appendChild(div);
  });

  function renderSkillList(el, items) {
    (items || []).forEach(function (item) {
      const li = document.createElement('li');
      li.innerHTML = '<span>' + item.label + '</span><span class="v">' + item.tag + '</span>';
      el.appendChild(li);
    });
  }
  const skills = data.skills || {};
  renderSkillList(document.getElementById('skills-engineering'), skills.engineering);
  renderSkillList(document.getElementById('skills-tools'), skills.tools);

  const expList = document.getElementById('experience-list');
  (data.experience || []).forEach(function (exp) {
    const div = document.createElement('div');
    div.className = 'exp-block';
    const bulletsHtml = (exp.bullets || []).map(function (b) {
      return '<li>' + b + '</li>';
    }).join('');
    div.innerHTML =
      '<div class="exp-head">' +
        '<h3>' + exp.title + '</h3>' +
        '<div class="dates mono">' + exp.dates + '</div>' +
      '</div>' +
      '<ul>' + bulletsHtml + '</ul>';
    expList.appendChild(div);
  });

  const contact = data.contact || {};
  const emailEl = document.getElementById('contact-email');
  emailEl.textContent = contact.email || "";
  emailEl.href = "mailto:" + (contact.email || "");

  const linkedinEl = document.getElementById('contact-linkedin');
  linkedinEl.textContent = (contact.linkedin || {}).text || "";
  linkedinEl.href = (contact.linkedin || {}).href || "#";

  const phoneEl = document.getElementById('contact-phone');
  phoneEl.textContent = (contact.phone || {}).text || "";
  phoneEl.href = (contact.phone || {}).href || "#";

  const resumeEl = document.getElementById('contact-resume');
  resumeEl.textContent = (contact.resume || {}).text || "";
  resumeEl.href = (contact.resume || {}).href || "#";

  document.getElementById('footnote').textContent =
    'DRAWN BY ' + (p.firstName || '').toUpperCase() + ' · CCNY MECHANICAL ENGINEERING · ' + (p.rev || '');
})();
</script>

</body>
</html>
